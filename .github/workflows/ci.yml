name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type-check & Build
        run: npm run build

      - name: Type-check tests
        run: npm run typecheck:tests

      - name: Run tests
        run: npm run test

  # Det-math goldens (0.8.0) recomputed from the built bundle in Chromium,
  # Firefox and WebKit (Playwright's WebKit is CI's stand-in for Safari / iOS
  # JavaScriptCore). Independent of build-and-test so it runs in parallel.
  engines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Det-math goldens in every engine
        run: CI=true npm run test:engines
